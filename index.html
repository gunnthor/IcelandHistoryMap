<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0e11" />
    <title>Sagas of Blood & Fire — Iceland's violent history, mapped</title>
    <meta name="description" content="An interactive map of Iceland's messiest historical conflicts. History for the curious, not the patient." />
    <!-- Domain-free OG tags for the homepage; per-event pages get full
         canonical/og:url tags, and every page gets the absolute share-image
         URL, injected at build time (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sagas of Blood & Fire" />
    <meta property="og:description" content="An interactive map of Iceland's messiest historical conflicts. History for the curious, not the patient." />
    <meta name="twitter:card" content="summary" />
    <!-- Map tiles: open the connection while the app boots. Fonts are
         self-hosted (src/styles/fonts.css), so nothing here blocks render. -->
    <link rel="preconnect" href="https://server.arcgisonline.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
